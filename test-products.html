<!DOCTYPE html>
<html>
<head>
    <title>Test Products</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .product { border: 1px solid #ccc; padding: 10px; margin: 10px 0; }
        .product img { max-width: 200px; }
    </style>
</head>
<body>
    <h1>Products Test</h1>
    <div id="products"></div>

    <script>
        fetch('/api/products?storage=true&limit=10')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('products');
                container.innerHTML = `<p>Total: ${data.products.length}</p>`;

                data.products.slice(0, 5).forEach(product => {
                    const div = document.createElement('div');
                    div.className = 'product';
                    div.innerHTML = `
                        <h3>${product.name}</h3>
                        <p>Price: ${product.price}</p>
                        <p>Images: ${product.images ? product.images.length : 0}</p>
                        ${product.images && product.images.length > 0 ? `<img src="${product.images[0]}" alt="${product.name}" onerror="this.style.display='none'">` : '<p>No image</p>'}
                        <p>Slug: ${product.slug}</p>
                        <a href="/store/product/${product.slug}">View Product</a>
                    `;
                    container.appendChild(div);
                });
            })
            .catch(err => console.error(err));
    </script>
</body>
</html>
